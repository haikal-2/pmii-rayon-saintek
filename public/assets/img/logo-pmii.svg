<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lambang PMII">
  <title>Lambang Pergerakan Mahasiswa Islam Indonesia</title>

  <defs>
    <!-- Bintang lima sudut; dipakai ulang lewat <use> dengan translate + scale -->
    <path id="bintang"
      d="M0,-1 L0.2245,-0.309 L0.9511,-0.309 L0.3633,0.118 L0.5878,0.809 L0,0.382 L-0.5878,0.809 L-0.3633,0.118 L-0.9511,-0.309 L-0.2245,-0.309 Z" />
  </defs>

  <!-- ===================================================================
       Cincin dekoratif: tiga busur terputus mengelilingi perisai.

       Digambar sebagai lingkaran penuh yang sebagian disembunyikan dengan
       stroke-dasharray, bukan sebagai path busur. Cara ini membuat sudut
       awal dan panjang busur dapat diatur lewat angka derajat yang mudah
       dibaca, dan jari-jarinya dijamin konsentris terhadap perisai.

       Keliling = 2 x pi x r. Panjang bagian tampak = keliling x derajat/360.
       =================================================================== -->
  <g fill="none" stroke-linecap="round" transform="translate(256 256)">
    <!-- Kuning: r=234, tampak 180 derajat, mulai 120 derajat (kiri bawah ke kanan atas) -->
    <circle r="234" stroke="#FFC20E" stroke-width="15"
      stroke-dasharray="735 735" transform="rotate(120)" />
    <!-- Biru muda: r=212, tampak 190 derajat, mulai 200 derajat (menyapu sisi atas) -->
    <circle r="212" stroke="#7FC3E8" stroke-width="12"
      stroke-dasharray="703 629" transform="rotate(200)" />
    <!-- Abu tua: r=224, tampak 140 derajat, mulai 30 derajat (menopang sisi bawah) -->
    <circle r="224" stroke="#4A4A4A" stroke-width="14"
      stroke-dasharray="547 861" transform="rotate(30)" />
  </g>

  <!-- ===================== Perisai ===================== -->
  <!-- Mahkota emas bertepi gelombang, memuat 5 bintang (rukun Islam) -->
  <path
    d="M 152 208 L 152 176
       C 158 132 186 122 200 152
       C 214 182 232 128 256 124
       C 280 128 298 182 312 152
       C 326 122 354 132 360 176
       L 360 208 Z"
    fill="#FFC20E" />

  <g fill="#FFFFFF">
    <use href="#bintang" transform="translate(181 177) scale(14.5)" />
    <use href="#bintang" transform="translate(218.5 175) scale(14.5)" />
    <use href="#bintang" transform="translate(256 173) scale(14.5)" />
    <use href="#bintang" transform="translate(293.5 175) scale(14.5)" />
    <use href="#bintang" transform="translate(331 177) scale(14.5)" />
  </g>

  <!-- Badan perisai biru, meruncing di bawah -->
  <path
    d="M 152 216 L 360 216 L 360 306
       C 360 372 322 416 256 442
       C 190 416 152 372 152 306 Z"
    fill="#1668C4" />

  <!-- Tulisan PMII digambar sebagai path, bukan elemen <text>, supaya
       bentuknya identik di semua perangkat tanpa bergantung font terpasang. -->
  <g fill="#21209C" fill-rule="evenodd">
    <!-- P: batang tegak + mangkuk berlubang -->
    <path d="M 176 268 L 208 268 A 28 28 0 0 1 208 324 L 191 324 L 191 352 L 176 352 Z
             M 191 282 L 206 282 A 14 14 0 0 1 206 310 L 191 310 Z" />
    <!-- M -->
    <path d="M 228 352 L 228 268 L 243 268 L 256 300 L 269 268 L 284 268 L 284 352
             L 269 352 L 269 303 L 260 325 L 252 325 L 243 303 L 243 352 Z" />
    <!-- I -->
    <path d="M 296 268 L 311 268 L 311 352 L 296 352 Z" />
    <!-- I -->
    <path d="M 321 268 L 336 268 L 336 352 L 321 352 Z" />
  </g>

  <!-- 4 bintang membentuk busur landai di bawah tulisan (mazhab empat) -->
  <g fill="#FFFFFF">
    <use href="#bintang" transform="translate(201 380) scale(12.5)" />
    <use href="#bintang" transform="translate(238 392) scale(12.5)" />
    <use href="#bintang" transform="translate(274 392) scale(12.5)" />
    <use href="#bintang" transform="translate(311 380) scale(12.5)" />
  </g>
</svg>
