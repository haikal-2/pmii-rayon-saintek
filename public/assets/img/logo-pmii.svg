<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" role="img" aria-label="Lambang PMII">
  <title>Lambang PMII</title>
  <defs>
    <!-- Bintang lima sudut, dipakai ulang lewat <use> -->
    <path id="pmii-star"
      d="M0,-1 L0.2351,-0.3236 L0.9511,-0.309 L0.3804,0.1236 L0.5878,0.809 L0,0.4 L-0.5878,0.809 L-0.3804,0.1236 L-0.9511,-0.309 L-0.2351,-0.3236 Z" />

    <!-- Perisai: 5 sisi atas, ujung membulat di bawah -->
    <clipPath id="pmii-shield">
      <path d="M50 3 L95 25 L95 68 C95 91 76 108 50 117 C24 108 5 91 5 68 L5 25 Z" />
    </clipPath>

    <linearGradient id="pmii-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1829b6" />
      <stop offset="1" stop-color="#0b1a5c" />
    </linearGradient>
    <linearGradient id="pmii-yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffdb4a" />
      <stop offset="1" stop-color="#f9a607" />
    </linearGradient>
  </defs>

  <g clip-path="url(#pmii-shield)">
    <!-- Bidang biru (atas): 3 bintang = Iman, Islam, Ihsan -->
    <rect x="0" y="0" width="100" height="120" fill="url(#pmii-blue)" />
    <g fill="#ffdb4a">
      <use href="#pmii-star" transform="translate(28 32) scale(8)" />
      <use href="#pmii-star" transform="translate(50 25) scale(8)" />
      <use href="#pmii-star" transform="translate(72 32) scale(8)" />
    </g>
    <text x="50" y="54" text-anchor="middle" fill="#ffdb4a" font-family="Sora, Verdana, sans-serif"
      font-size="15" font-weight="700" letter-spacing="0.5">PMII</text>

    <!-- Bidang kuning (bawah): 6 bintang = rukun iman -->
    <path d="M0 60 L100 68 L100 120 L0 120 Z" fill="url(#pmii-yellow)" />
    <g fill="#0b1a5c">
      <use href="#pmii-star" transform="translate(26 79) scale(6)" />
      <use href="#pmii-star" transform="translate(50 82) scale(6)" />
      <use href="#pmii-star" transform="translate(74 85) scale(6)" />
      <use href="#pmii-star" transform="translate(33 98) scale(6)" />
      <use href="#pmii-star" transform="translate(52 100) scale(6)" />
      <use href="#pmii-star" transform="translate(69 101) scale(6)" />
    </g>
  </g>

  <!-- Garis tepi perisai -->
  <path d="M50 3 L95 25 L95 68 C95 91 76 108 50 117 C24 108 5 91 5 68 L5 25 Z" fill="none"
    stroke="#0b1a5c" stroke-width="3" stroke-linejoin="round" />
</svg>
