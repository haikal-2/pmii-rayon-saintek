# =============================================================================
#  Nginx — www.pmiiuinsgd.site
#
#  Pasang:
#    sudo cp deploy/nginx.conf /etc/nginx/sites-available/pmii
#    sudo ln -s /etc/nginx/sites-available/pmii /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d pmiiuinsgd.site -d www.pmiiuinsgd.site
#
#  Certbot akan menambahkan sendiri blok listen 443 beserta jalur sertifikatnya.
# =============================================================================

# Batas laju tingkat Nginx sebagai lapis pertama, sebelum permintaan sampai ke
# Node. Zona "api" longgar karena satu jaringan Wi-Fi kampus tampak sebagai satu
# IP saat CBT berlangsung; zona "form" ketat karena hanya dipakai pengiriman
# formulir yang tidak mungkin cepat berulang.
limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=form:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=konek:10m;

upstream pmii_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# --- Pengalihan HTTP → HTTPS -------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name pmiiuinsgd.site www.pmiiuinsgd.site;

    # Biarkan certbot memvalidasi domain
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://www.pmiiuinsgd.site$request_uri; }
}

# --- Pengalihan apex → www ---------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pmiiuinsgd.site;

    # ssl_certificate ... (diisi certbot)
    return 301 https://www.pmiiuinsgd.site$request_uri;
}

# --- Situs utama -------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.pmiiuinsgd.site;

    root  /var/www/pmii/public;
    index index.html;
    charset utf-8;

    # ssl_certificate / ssl_certificate_key diisi certbot

    # ---------------------------------------------------- Header keamanan
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Content-Security-Policy.
    # Sumber luar yang benar-benar dipakai situs ini:
    #   fonts.googleapis.com / fonts.gstatic.com  → font Plus Jakarta Sans & Sora
    #   challenges.cloudflare.com                 → widget Turnstile (bila aktif)
    #   res.cloudinary.com                        → gambar galeri
    # 'unsafe-inline' pada script-src masih diperlukan karena beberapa halaman
    # memuat skrip kecil sebaris; hapus setelah skrip tersebut dipindah ke berkas.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com https://*.amazonaws.com https://*.r2.cloudflarestorage.com; connect-src 'self'; frame-src https://challenges.cloudflare.com https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # ---------------------------------------------------------- Kompresi
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/json application/javascript
                      application/xml+rss image/svg+xml application/manifest+json;

    # Aktifkan bila modul Brotli terpasang — rasio ±20% lebih baik dari gzip.
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/css application/javascript image/svg+xml application/json;

    client_max_body_size 12M;   # sedikit di atas batas unggah 10 MB pada API

    # ------------------------------------------------------------- API
    location /api/ {
        limit_req  zone=api burst=60 nodelay;
        limit_conn konek 30;

        proxy_pass         http://pmii_api;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Pengerjaan CBT bisa berlangsung lama; jangan putus koneksi terlalu cepat.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Pembatasan lebih ketat khusus formulir publik dan login.
    location ~ ^/api/v1/(advokasi/pengaduan|mapaba/pendaftaran|upload|admin/auth/login|cbt/auth/login)$ {
        limit_req  zone=form burst=5 nodelay;
        proxy_pass         http://pmii_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Berkas unggahan (bila STORAGE_DRIVER=local). Dilayani Nginx, bukan Node.
    location /uploads/ {
        alias /var/www/pmii/server/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # Cegah berkas yang menyamar dieksekusi atau ditampilkan sebagai HTML.
        add_header X-Content-Type-Options "nosniff" always;
        location ~* \.(php|phtml|html|htm|js|svg)$ { deny all; }
    }

    # ------------------------------------------------------ Aset statis
    # Nama berkas CSS/JS belum ber-hash, jadi cache-nya sedang saja agar
    # pembaruan tampilan tidak tertahan lama di peramban pengunjung.
    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* \.(jpg|jpeg|png|webp|avif|gif|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------ Halaman
    # URL bersih: /artikel menampilkan /artikel.html
    location / {
        try_files $uri $uri.html $uri/ /404.html;
    }

    location = /404.html { internal; }

    # Jangan sajikan berkas tersembunyi
    location ~ /\. { deny all; }
}
