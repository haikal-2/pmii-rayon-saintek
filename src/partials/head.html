<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{ title }}</title>
<meta name="description" content="{{ description }}" />
<meta name="theme-color" content="#122a8f" />
<meta name="author" content="{{ site.longName }}" />

<!-- Open Graph / social share -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{ site.name }}" />
<meta property="og:title" content="{{ title }}" />
<meta property="og:description" content="{{ description }}" />
<meta property="og:image" content="{{base}}assets/img/logo-pmii.svg" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" type="image/svg+xml" href="{{base}}assets/img/logo-pmii.svg" />
<link rel="apple-touch-icon" href="{{base}}assets/img/logo-pmii.svg" />

<!-- Font: Plus Jakarta Sans (body) + Sora (display). Fallback ke system font. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
  rel="stylesheet" />

<link rel="stylesheet" href="{{base}}assets/css/style.css" />
