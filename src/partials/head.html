<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<!-- ===== SEO dasar =====================================================
     Title: 50–60 karakter, memuat kata kunci utama + nama organisasi.
     Description: 140–160 karakter, ditulis untuk manusia, bukan mesin —
     inilah teks yang muncul di bawah judul pada hasil pencarian Google.
     ==================================================================== -->
<title>{{ title }}</title>
<meta name="description" content="{{ description }}" />
<meta name="keywords" content="{{ keywords }}" />
<meta name="robots" content="{{ robots }}" />
<meta name="googlebot" content="{{ robots }}" />
<link rel="canonical" href="{{ canonical }}" />

<meta name="author" content="{{ site.longName }}" />
<meta name="publisher" content="{{ site.longName }}" />
<meta name="theme-color" content="#122a8f" />
<meta name="format-detection" content="telephone=no" />

<!-- Sinyal lokasi: membantu pencarian "PMII Kabupaten Bandung" -->
<meta name="geo.region" content="ID-JB" />
<meta name="geo.placename" content="Kabupaten Bandung, Jawa Barat" />
<meta name="language" content="Indonesian" />

<!-- ===== Open Graph (Facebook, WhatsApp, LinkedIn) ===================== -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="{{ site.name }}" />
<meta property="og:locale" content="id_ID" />
<meta property="og:title" content="{{ title }}" />
<meta property="og:description" content="{{ description }}" />
<meta property="og:url" content="{{ canonical }}" />
<meta property="og:image" content="{{ ogImage }}" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Lambang PK PMII UIN Sunan Gunung Djati Cabang Kabupaten Bandung" />

<!-- ===== Twitter / X =================================================== -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ title }}" />
<meta name="twitter:description" content="{{ description }}" />
<meta name="twitter:image" content="{{ ogImage }}" />

<link rel="icon" type="image/svg+xml" href="{{base}}assets/img/logo-pmii.svg" />
<link rel="apple-touch-icon" href="{{base}}assets/img/logo-pmii.svg" />
<link rel="manifest" href="{{base}}site.webmanifest" />

<!-- Font: Plus Jakarta Sans (body) + Sora (display). Fallback ke font sistem.
     preconnect dipasang agar unduhan font dimulai lebih awal. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap"
  rel="stylesheet" />

<link rel="stylesheet" href="{{base}}assets/css/style.css" />

<!-- Animasi masuk dijalankan JavaScript; tanpa JS, tampilkan langsung. -->
<noscript>
  <style>
    .reveal {
      opacity: 1 !important;
      transform: none !important;
    }
  </style>
</noscript>
