<!DOCTYPE html>
<!--
  Sumber gambar Open Graph (1200×630) — gambar yang muncul saat tautan situs
  dibagikan di WhatsApp, Facebook, atau X.

  Hasil rasterisasi disimpan sebagai public/assets/img/og-image.jpg.
  Untuk membuat ulang setelah menyunting berkas ini:

    google-chrome --headless=new --disable-gpu --hide-scrollbars \
      --window-size=1200,630 --screenshot=/tmp/og.png "$PWD/src/og-image.html"
    ffmpeg -y -i /tmp/og.png -qscale:v 3 public/assets/img/og-image.jpg

  Dikonversi ke JPEG karena gradasi dan efek blur membuat PNG membengkak
  (450 KB → 115 KB) padahal WhatsApp dan Facebook sama-sama menerima JPEG.

  Perintah ini hanya perlu dijalankan saat desainnya berubah; berkas hasilnya
  ikut di-commit sehingga build harian tidak memerlukan Chrome.
-->
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      gap: 64px;
      padding: 0 80px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #0b1a5c 0%, #122a8f 55%, #1829b6 100%);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #fff;
    }

    /* Ornamen: pola grid halus + dua lingkaran kabur, sama seperti hero situs */
    .grid {
      position: absolute;
      inset: 0;
      opacity: 0.14;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.6) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.6) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(80% 80% at 50% 0%, black, transparent);
    }

    .blob-kuning {
      position: absolute;
      right: -120px;
      top: -140px;
      width: 460px;
      height: 460px;
      border-radius: 50%;
      background: rgba(249, 166, 7, 0.28);
      filter: blur(90px);
    }

    .blob-biru {
      position: absolute;
      left: -140px;
      bottom: -180px;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(89, 140, 255, 0.32);
      filter: blur(90px);
    }

    .logo { position: relative; flex-shrink: 0; }
    .logo img { width: 260px; height: auto; filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.35)); }

    .teks { position: relative; }

    .eyebrow {
      display: inline-block;
      padding: 8px 18px;
      border: 1px solid rgba(255, 219, 74, 0.35);
      border-radius: 999px;
      background: rgba(255, 219, 74, 0.12);
      color: #ffdb4a;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin-top: 26px;
      font-family: 'Sora', system-ui, sans-serif;
      font-size: 60px;
      font-weight: 800;
      line-height: 1.06;
      letter-spacing: -0.02em;
    }

    h1 .kuning { color: #ffdb4a; }

    .slogan {
      margin-top: 26px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: 'Sora', system-ui, sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
    }

    .titik { width: 8px; height: 8px; border-radius: 50%; background: #ffc820; }

    .kaki {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      font-size: 19px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.66);
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="blob-kuning"></div>
  <div class="blob-biru"></div>

  <div class="logo"><img src="../public/assets/img/logo-pmii.svg" alt="" /></div>

  <div class="teks">
    <span class="eyebrow">Salam Pergerakan</span>
    <h1>PK PMII <span class="kuning">UIN Sunan Gunung Djati</span><br />Cabang Kabupaten Bandung</h1>
    <div class="slogan">
      <span>Dzikir</span><span class="titik"></span>
      <span>Fikir</span><span class="titik"></span>
      <span>Amal Sholeh</span>
    </div>
    <p class="kaki">www.pmiiuinsgd.site</p>
  </div>
</body>
</html>
